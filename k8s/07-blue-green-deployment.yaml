# Blue Deployment (Current/Active)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-blue
  namespace: rps-game
  labels:
    app: frontend
    version: blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
      version: blue
  template:
    metadata:
      labels:
        app: frontend
        version: blue
    spec:
      containers:
      - name: frontend
        image: ghcr.io/YOUR_USERNAME/rps-betting-game/frontend:v1.0
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
# Green Deployment (New Version - Initially 0 replicas)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-green
  namespace: rps-game
  labels:
    app: frontend
    version: green
spec:
  replicas: 0  # Start with 0, scale up when ready to switch
  selector:
    matchLabels:
      app: frontend
      version: green
  template:
    metadata:
      labels:
        app: frontend
        version: green
    spec:
      containers:
      - name: frontend
        image: ghcr.io/YOUR_USERNAME/rps-betting-game/frontend:v2.0
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
# Service that can switch between blue and green
apiVersion: v1
kind: Service
metadata:
  name: frontend-bluegreen
  namespace: rps-game
  labels:
    app: frontend
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: frontend
    version: blue  # Change this to "green" to switch traffic