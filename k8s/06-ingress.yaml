apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rps-game-ingress
  namespace: rps-game
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 8080