apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: rps-game
data:
  PORT: "3000"
  NODE_ENV: "production"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: rps-game
type: Opaque
stringData:
  SEPOLIA_RPC_URL: "https://eth-sepolia.g.alchemy.com/v2/YOUR_API_KEY"
  PRIVATE_KEY: "your_private_key_here"
  MNEMONIC: "your mnemonic phrase here"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: rps-game
  labels:
    app: backend
spec:
  replicas: 3  # High availability with 3 instances
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0  # Cannot tolerate less replicas
      maxSurge: 1        # Can accommodate 1 extra Pod during update
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        version: v1
    spec:
      containers:
      - name: backend
        image: ghcr.io/YOUR_USERNAME/rps-betting-game/backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: PORT
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: NODE_ENV
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: REDIS_PORT
        - name: SEPOLIA_RPC_URL
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: SEPOLIA_RPC_URL
        - name: PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: PRIVATE_KEY
        - name: MNEMONIC
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: MNEMONIC
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: rps-game
  labels:
    app: backend
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: backend